name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true  # 255 檔尚未符合 format;待全 repo format 整修後移除

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: memory://
      SECRET_KEY: test-secret-key-for-testing
      JWT_SECRET_KEY: test-jwt-secret-key-for-testing-1234567890
      TEST_MODE: "true"
      TEST_MODE_CONFIRMATION: I_UNDERSTAND_THE_RISKS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist

      - name: Run tests (skip e2e and integration)
        run: |
          # -n auto: 平行跑(依 runner 核數)。完整套件 3,243 測試、12-20 分鐘,
          # 主因是每個測試重複初始化 app(import FastAPI+LangGraph),測試邏輯本身 <1s。
          # xdist 平行後實測 246s → 89s(2.8x),CI 預期 12min → ~4-5min。
          pytest -o addopts='-v --tb=short --no-cov' -m "not e2e and not integration" -n auto

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate i18n JSON files
        run: |
          python -c "
          import json, pathlib, sys
          files = pathlib.Path('web/js/i18n').glob('*.json')
          errors = []
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f'OK: {f}')
              except json.JSONDecodeError as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL: {f} - {e}')
          if errors:
              sys.exit(1)
          print(f'All {len(list(files))} i18n JSON files are valid.')
          "

  create-pr:
    runs-on: ubuntu-latest
    needs: [lint, test, validate-json]
    if: github.ref_name == 'develop' && github.event_name == 'push'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head develop --base main --state open --json number -q '.[0].number')
          if [ -n "$PR_EXISTS" ]; then
            echo "PR already exists: #$PR_EXISTS. Skipping."
          else
            gh pr create \
              --title "Release: merge develop into main (CI passed)" \
              --body "This PR was automatically created by GitHub Actions because all tests and CI checks passed on the develop branch. Please review and merge to deploy to production." \
              --base main \
              --head develop
          fi
