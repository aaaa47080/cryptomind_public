<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Wallet Tracker - CryptoMind Forum</title>
    <link rel="icon" type="image/png" href="/static/img/title_icon.png">
    <link rel="stylesheet" href="/static/css/tailwind-built.css">
    <script src="https://unpkg.com/lucide@0.577.0" crossorigin="anonymous" integrity="sha384-orgVf2eX2+m1zKAOIi09hD0W6GtVhoOUmqDK+sysYB2JTZ4vS86j4jm+X7a4Nnei"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/i18next.min.js" crossorigin="anonymous" integrity="sha384-OCCT+KZFt2FsqTxlTd8CUSq86zW/ZKmV0oe7qj36oye2CDbbVuxIXTY20t/u9LJt"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=15">
    <!-- TON Connect SDK loaded via main page -->
    <!-- TON Connect SDK loaded via main page -->
    <!-- early-init: 防 FOUC + 預設主題（與主站共用 localStorage.selectedTheme） -->
    <script src="/js/early-init.js"></script>
</head>
<body class="bg-background text-textMain min-h-screen" data-page="scam-list">
    <nav class="sticky top-0 z-50 bg-surface/95 backdrop-blur-xl border-b border-borderSubtle px-4 py-3">
        <div data-theme-toggle-gap class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-x-3 gap-y-2 pr-12">
            <a href="/static/index.html#chat" class="flex items-center gap-2 text-secondary font-bold hover:text-primary transition shrink-0">
                <i data-lucide="arrow-left" class="w-5 h-5 shrink-0"></i>
                <span class="whitespace-nowrap" data-i18n="safety.backToChat">Back to Chat</span>
            </a>
            <div class="order-last w-full text-center font-bold text-base text-primary sm:order-none sm:w-auto sm:text-lg"
                 data-i18n="safety.trackerTitle">Scam Wallet Tracker</div>
            <div class="flex items-center gap-2 shrink-0">
                <button data-click="toggleScamLanguage" class="px-3 py-2 rounded-lg border border-borderLight text-sm text-textMuted hover:text-secondary hover:border-primary/40 transition">
                    <span id="lang-toggle-label" class="whitespace-nowrap" data-i18n="safety.languageToggle">EN</span>
                </button>
                <button id="btn-submit-report" class="bg-primary text-background px-3 py-2 rounded-lg font-bold hover:opacity-90 transition whitespace-nowrap shrink-0">
                    <i data-lucide="alert-triangle" class="w-4 h-4 inline-block sm:mr-1"></i>
                    <span class="hidden sm:inline" data-i18n="safety.submitButton">Submit Report</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <div class="bg-surface border border-borderSubtle rounded-2xl p-4 mb-6">
            <div class="flex gap-2">
                <input
                    type="text"
                    id="search-wallet"
                    data-i18n="safety.searchPlaceholder"
                    data-i18n-attr="placeholder"
                    placeholder="Search wallet address..."
                    class="flex-1 bg-background border border-borderLight rounded-xl px-4 py-2 text-textMain focus:border-primary outline-none"
                >
                <button id="btn-search" class="bg-primary text-background px-6 py-2 rounded-xl font-bold hover:opacity-90 transition">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </button>
            </div>
            <!-- 地址健診 v0（design 2026-08-18）：多源判定卡，取代單一「查無」toast -->
            <div id="check-verdict" class="hidden mt-4 rounded-xl border p-4">
                <div class="flex items-center justify-between gap-3 mb-2">
                    <div class="flex items-center gap-2">
                        <span id="check-verdict-icon" class="text-xl"></span>
                        <span id="check-verdict-label" class="font-bold text-lg"></span>
                    </div>
                    <span id="check-verdict-family" class="text-xs px-2 py-0.5 rounded-full bg-surfaceHighlight text-textMuted"></span>
                </div>
                <ul id="check-verdict-reasons" class="text-sm text-textMuted list-disc pl-5 mb-3"></ul>
                <div id="check-verdict-sources" class="space-y-1 text-xs text-textMuted"></div>
                <p class="text-[11px] text-textMuted mt-3 opacity-70" data-i18n="safety.checkup.disclaimer">判定由多來源即時查詢自動產生，僅供參考，不構成保證。</p>
            </div>
        </div>

        <div class="bg-surface border border-borderSubtle rounded-2xl p-4 mb-6">
            <div class="flex flex-wrap gap-3">
                <select id="filter-type" class="bg-background border border-borderLight rounded-lg px-3 py-2 text-textMain focus:border-primary outline-none">
                    <option value="" data-i18n="safety.filters.allTypes">All Types</option>
                </select>
                <select id="filter-status" class="bg-background border border-borderLight rounded-lg px-3 py-2 text-textMain focus:border-primary outline-none">
                    <option value="" data-i18n="safety.filters.allStatus">All Status</option>
                    <option value="verified" data-i18n="safety.filters.verified">Verified</option>
                    <option value="pending" data-i18n="safety.filters.pending">Pending</option>
                    <option value="disputed" data-i18n="safety.filters.disputed">Disputed</option>
                </select>
                <select id="sort-by" class="bg-background border border-borderLight rounded-lg px-3 py-2 text-textMain focus:border-primary outline-none">
                    <option value="latest" data-i18n="safety.filters.latest">Latest</option>
                    <option value="most_voted" data-i18n="safety.filters.mostVoted">Most Voted</option>
                    <option value="most_viewed" data-i18n="safety.filters.mostViewed">Most Viewed</option>
                </select>
            </div>
        </div>

        <div id="report-list" class="space-y-4">
            <div class="text-center text-textMuted py-8" data-i18n="safety.loadingReports">Loading reports...</div>
        </div>

        <div class="text-center mt-6">
            <button id="btn-load-more" class="bg-surfaceHighlight text-secondary px-6 py-3 rounded-xl font-bold hover:bg-surfaceHighlight transition hidden" data-i18n="safety.loadMore">
                Load More
            </button>
        </div>
    </main>

    <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"
        class="fixed z-[110] flex flex-col gap-3 pointer-events-none bottom-4 left-4 right-4 items-center md:bottom-auto md:top-24 md:left-auto md:right-4 md:items-end"
        style="bottom: var(--shell-toast-bottom, calc(1rem + env(safe-area-inset-bottom, 0px)));"></div>

    <script src="/static/config.js"></script>
    <script src="/static/js/click-delegator.js?v=2"></script>
    <script src="/static/js/logger.js"></script>
    <script type="module" src="/static/js/classic-compat-app.js?v=1"></script>
    <script src="/static/scam-tracker/js/scam-tracker.js?v=49"></script>
    <script src="/static/scam-tracker/js/scam-tracker-i18n.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof initializeAuth === 'function') initializeAuth();
            if (window.I18n) await window.I18n.init();
            if (typeof ScamTrackerApp !== 'undefined') await ScamTrackerApp.initListPage();
            lucide.createIcons();
        });
    </script>
    <!-- 子頁主題切換鈕（右上角） -->
    <script src="/js/components/ThemeToggle.js"></script>
    <script src="/js/site-sidebar.js?v=1"></script>
</body>
</html>
